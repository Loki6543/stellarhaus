<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ikebukuro Gambit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root { --scr: #0f380f; --hi: #8bac0f; --shell: #16131a; --shell2: #221d27; --btn: #2b2430; --accent: #c23b4a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--shell); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #b9adc2; }
#shell { height: 100%; display: flex; flex-direction: column; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); gap: 14px; }
#bezel { width: 100%; max-width: 560px; background: var(--shell2); border-radius: 14px 14px 40px 14px; padding: 12px 18px 16px; box-shadow: inset 0 2px 0 #ffffff10, 0 10px 30px #0008; position: relative; }
#bezel .lbl { font-size: 10px; letter-spacing: .25em; color: #8d7f98; margin: 0 0 8px 4px; display: flex; align-items: center; gap: 8px; }
#bezel .lbl::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
#bezel .lbl b { color: var(--accent); font-weight: 700; }
canvas { display: block; width: 100%; aspect-ratio: 160 / 144; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--scr); border-radius: 3px; }
#pad { width: 100%; max-width: 560px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; align-items: center; min-height: 0; }
#dpad { justify-self: start; position: relative; width: min(42vw, 170px); aspect-ratio: 1; margin-left: 4px; touch-action: none; }
#dpad .arm { position: absolute; background: var(--btn); box-shadow: inset 0 -3px 0 #0006, 0 3px 8px #0006; }
#dpad .h { left: 0; right: 0; top: 33.3%; height: 33.4%; border-radius: 8px; }
#dpad .v { top: 0; bottom: 0; left: 33.3%; width: 33.4%; border-radius: 8px; }
#dpad .hub { position: absolute; left: 42%; top: 42%; width: 16%; height: 16%; border-radius: 50%; background: #0003; }
#dpad .tri { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: .45; }
#dpad .tri.u { left: 50%; top: 8%; transform: translateX(-50%); border-bottom-color: #c9bfd3; border-top-width: 0; }
#dpad .tri.d { left: 50%; bottom: 8%; transform: translateX(-50%); border-top-color: #c9bfd3; border-bottom-width: 0; }
#dpad .tri.l { top: 50%; left: 8%; transform: translateY(-50%); border-right-color: #c9bfd3; border-left-width: 0; }
#dpad .tri.r { top: 50%; right: 8%; transform: translateY(-50%); border-left-color: #c9bfd3; border-right-width: 0; }
#dpad[data-dir=up] .tri.u, #dpad[data-dir=down] .tri.d, #dpad[data-dir=left] .tri.l, #dpad[data-dir=right] .tri.r { opacity: 1; border-bottom-color: var(--accent); border-top-color: var(--accent); border-left-color: var(--accent); border-right-color: var(--accent); }
#dpad[data-dir=up] .tri.u { border-left-color: transparent; border-right-color: transparent; border-top-color: transparent; }
#dpad[data-dir=down] .tri.d { border-left-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
#dpad[data-dir=left] .tri.l { border-top-color: transparent; border-bottom-color: transparent; border-left-color: transparent; }
#dpad[data-dir=right] .tri.r { border-top-color: transparent; border-bottom-color: transparent; border-right-color: transparent; }
#ab { justify-self: end; display: flex; gap: 14px; transform: rotate(-22deg); margin-right: 6px; }
#ab button { width: min(19vw, 76px); aspect-ratio: 1; border-radius: 50%; border: none; background: var(--accent); color: #ffffffd0; font: 700 20px system-ui; box-shadow: inset 0 -4px 0 #0005, 0 4px 10px #0007; touch-action: none; }
#ab button[data-b=b] { margin-top: 26px; background: #8c2a37; }
#ab button.on, #ss button.on { transform: translateY(2px); filter: brightness(1.25); }
#ss { grid-column: 1 / span 2; justify-self: center; display: flex; gap: 22px; padding-bottom: 6px; }
#ss button { border: none; background: var(--btn); color: #9d90a8; font: 600 11px system-ui; letter-spacing: .12em; padding: 9px 18px; border-radius: 20px; transform: rotate(-22deg); box-shadow: inset 0 -2px 0 #0006; touch-action: none; }
#fs { position: absolute; right: 12px; top: 6px; background: none; border: none; color: #8d7f98; font-size: 16px; padding: 4px 6px; }
@media (orientation: landscape) and (max-height: 600px) {
  #shell { flex-direction: row; justify-content: center; padding: 8px max(12px, env(safe-area-inset-left)); gap: 10px; }
  #bezel { order: 2; width: auto; height: 100%; max-width: none; padding: 8px 10px; border-radius: 12px; display: flex; flex-direction: column; }
  #bezel canvas { height: calc(100% - 20px); width: auto; }
  #pad { display: contents; }
  #dpad { order: 1; align-self: center; width: min(30vh, 150px); }
  #ab { order: 3; align-self: center; flex-direction: column-reverse; transform: none; }
  #ab button[data-b=b] { margin: 0 0 0 30px; }
  #ss { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); }
}
</style>
</head>
<body>
<div id="shell">
  <div id="bezel">
    <div class="lbl">IKEBUKURO <b>GAMBIT</b></div>
    <button id="fs" aria-label="Fullscreen">⛶</button>
    <canvas id="screen" width="160" height="144"></canvas>
  </div>
  <div id="pad">
    <div id="dpad" aria-label="D-pad">
      <div class="arm h"></div><div class="arm v"></div><div class="hub"></div>
      <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
    </div>
    <div id="ab"><button data-b="b">B</button><button data-b="a">A</button></div>
    <div id="ss"><button data-b="select">SELECT</button><button data-b="start">START</button></div>
  </div>
</div>
<script src="core.js"></script>
<script src="city.js"></script>
<script src="story.js"></script>
<script>
boot();
document.getElementById('fs').addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => { try { screen.orientation.lock('portrait'); } catch (e) {} }).catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen();
});
document.addEventListener('contextmenu', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
